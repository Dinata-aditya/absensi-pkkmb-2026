<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registrasi Mahasiswa PKKMB 2026">
    <title>Daftar Akun - PKKMB 2026</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
        }
        
        .register-card {
            width: 100%;
            max-width: 500px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        .password-strength {
            height: 4px;
            background-color: var(--gray-200);
            border-radius: var(--radius-sm);
            margin-top: var(--spacing-xs);
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all var(--transition-base);
        }
        
        .password-strength-weak { 
            width: 33%; 
            background-color: var(--danger-color); 
        }
        
        .password-strength-medium { 
            width: 66%; 
            background-color: var(--warning-color); 
        }
        
        .password-strength-strong { 
            width: 100%; 
            background-color: var(--success-color); 
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card card">
            <div class="card-header">
                <h2 class="card-title text-center">Daftar Akun Mahasiswa</h2>
                <p class="text-center" style="color: var(--gray-600); margin: 0;">
                    PKKMB 2026 UPP
                </p>
            </div>
            
            <div class="card-body">
                <!-- Alert Container -->
                <div id="alertContainer"></div>
                
                <!-- Registration Form -->
                <form id="registerForm">
                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="form-label required">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="contoh@email.com"
                            required
                            autocomplete="email"
                        >
                        <span class="form-error" id="emailError"></span>
                    </div>
                    
                    <!-- Password Row -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="password" class="form-label required">Password</label>
                            <input 
                                type="password" 
                                id="password" 
                                class="form-input" 
                                placeholder="Masukkan password"
                                required
                                autocomplete="new-password"
                            >
                            <span class="form-error" id="passwordError"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmPassword" class="form-label required">Konfirmasi Password</label>
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                class="form-input" 
                                placeholder="Ulangi password"
                                required
                                autocomplete="new-password"
                            >
                            <span class="form-error" id="confirmPasswordError"></span>
                        </div>
                    </div>
                    
                    <!-- NIM -->
                    <div class="form-group">
                        <label for="nim" class="form-label required">NIM</label>
                        <input 
                            type="text" 
                            id="nim" 
                            class="form-input" 
                            placeholder="Nomor Induk Mahasiswa"
                            required
                            pattern="[0-9]+"
                            title="NIM hanya boleh berisi angka"
                        >
                        <span class="form-error" id="nimError"></span>
                    </div>
                    
                    <!-- Nama Lengkap -->
                    <div class="form-group">
                        <label for="namaLengkap" class="form-label required">Nama Lengkap</label>
                        <input 
                            type="text" 
                            id="namaLengkap" 
                            class="form-input" 
                            placeholder="Nama lengkap"
                            required
                            autocomplete="name"
                        >
                        <span class="form-error" id="namaError"></span>
                    </div>
                    
                    <!-- Fakultas -->
                    <div class="form-group">
                        <label for="fakultas" class="form-label required">Fakultas</label>
                        <select id="fakultas" class="form-select" required>
                            <option value="">-- Pilih Fakultas --</option>
                        </select>
                        <span class="form-error" id="fakultasError"></span>
                    </div>
                    
                    <!-- Program Studi -->
                    <div class="form-group">
                        <label for="prodi" class="form-label required">Program Studi</label>
                        <select id="prodi" class="form-select" required disabled>
                            <option value="">-- Pilih Fakultas Terlebih Dahulu --</option>
                        </select>
                        <span class="form-error" id="prodiError"></span>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitBtn">
                        <span id="submitText">Daftar</span>
                        <span id="submitSpinner" class="spinner" style="display: none;"></span>
                    </button>
                </form>
                
                <!-- Login Link -->
                <div class="text-center mt-3">
                    <p style="color: var(--gray-600);">
                        Sudah punya akun? 
                        <a href="login.html">Masuk di sini</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Config & Auth -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    
    <!-- Register Logic - Load after config -->
    <script>
        // Ensure config.js loaded first
        if (typeof supabase === 'undefined') {
            console.error('Supabase not initialized');
            alert('Error: Cannot connect to server. Please refresh the page.');
        }
    </script>
    <script src="js/register.js"></script>
</body>
</html>
