<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QR Scanner Absensi PKKMB 2026">
    <title>Scan QR - PKKMB 2026</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }
        
        .scanner-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .scanner-header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        .scanner-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .scanner-view {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            overflow: hidden;
        }
        
        #qr-reader {
            width: 100%;
            height: 100%;
            display: flex !important;
            align-items: center;
            justify-content: center;
        }
        
        #qr-reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }
        
        .scanner-overlay {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        
        .scanner-frame-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .scanner-frame {
            width: 320px;
            height: 320px;
            border: 4px solid #4ade80;
            border-radius: 12px;
            box-shadow: 
                0 0 0 9999px rgba(0, 0, 0, 0.6),
                inset 0 0 20px rgba(74, 222, 128, 0.2),
                0 0 30px rgba(74, 222, 128, 0.3);
            position: relative;
            background: rgba(0, 0, 0, 0.1);
        }
        
        .scanner-frame::before,
        .scanner-frame::after {
            content: '';
            position: absolute;
            background: #4ade80;
        }
        
        .scanner-frame::before {
            top: -2px;
            left: -2px;
            width: 30px;
            height: 30px;
            border-top: 4px solid #4ade80;
            border-left: 4px solid #4ade80;
            border-radius: 4px;
            background: none;
        }
        
        .scanner-frame::after {
            bottom: -2px;
            right: -2px;
            width: 30px;
            height: 30px;
            border-bottom: 4px solid #4ade80;
            border-right: 4px solid #4ade80;
            border-radius: 4px;
            background: none;
        }
        
        .scanner-instruction {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--white);
            text-align: center;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .scanner-status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #4ade80;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .result-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        
        .result-container.show {
            display: flex;
        }
        
        .result-card {
            background: var(--white);
            border-radius: 20px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }
        
        .result-success {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: #065f46;
        }
        
        .result-error {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: #991b1b;
        }
        
        .result-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1f2937;
        }
        
        .result-message {
            color: #6b7280;
            margin-bottom: 24px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <div class="scanner-container">
        <!-- Header -->
        <div class="scanner-header">
            <div class="scanner-title">Scan QR Absensi</div>
            <a href="mahasiswa-dashboard.html" class="btn btn-sm" style="background-color: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3);">
                Tutup
            </a>
        </div>
        
        <!-- Scanner View -->
        <div class="scanner-view">
            <div id="qr-reader"></div>
            
            <div class="scanner-overlay">
                <div class="scanner-frame-wrapper">
                    <div class="scanner-status">● Scanning</div>
                    <div class="scanner-frame"></div>
                    <div class="scanner-instruction">
                        Arahkan kamera ke QR Code
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Result Display -->
    <div id="resultContainer" class="result-container">
        <div class="result-card">
            <div id="resultIcon" class="result-icon"></div>
            <h2 id="resultTitle" class="result-title"></h2>
            <p id="resultMessage" class="result-message"></p>
            <button class="btn btn-primary btn-lg" onclick="closeResult()">
                OK
            </button>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- HTML5 QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <!-- Config & Auth -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    
    <!-- Scanner Logic -->
    <script src="js/scanner.js"></script>
    <script src="js/helpbutton.js"></script>

    <footer style="position: fixed; bottom: 0; left: 0; right: 0; text-align: center; padding: 0.5rem; background: rgba(0,0,0,0.8); border-top: 1px solid rgba(255,255,255,0.1); z-index: 5;">
        <p style="margin: 0; font-size: 0.75rem; color: rgba(255,255,255,0.6);">© 2026 PKKMB UPP - Dinata.dev</p>
    </footer>
</body>
</html>
