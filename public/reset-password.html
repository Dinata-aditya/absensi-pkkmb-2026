<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset Password PKKMB 2026">
    <title>Lupa Password - PKKMB 2026</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .reset-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
        }
        
        .reset-card {
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card card">
            <div class="card-header">
                <h2 class="card-title text-center">Lupa Password</h2>
                <p class="text-center" style="color: var(--gray-600); margin: 0;">
                    Kami akan mengirim link reset password ke email Anda
                </p>
            </div>
            
            <div class="card-body">
                <!-- Alert Container -->
                <div id="alertContainer"></div>
                
                <!-- Reset Form -->
                <form id="resetForm">
                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="form-label required">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="Masukkan email Anda"
                            required
                            autocomplete="email"
                            autofocus
                        >
                        <span class="form-error" id="emailError"></span>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitBtn">
                        <span id="submitText">Kirim Link Reset</span>
                        <span id="submitSpinner" class="spinner" style="display: none;"></span>
                    </button>
                </form>
                
                <!-- Back to Login -->
                <div class="text-center mt-3">
                    <a href="login.html" style="font-size: var(--font-size-sm); color: var(--gray-600);">
                        ← Kembali ke Login
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Config -->
    <script src="js/config.js"></script>
    
    <!-- Reset Password Logic -->
    <script>
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showAlert('Email wajib diisi', 'danger');
                return;
            }
            
            // Show loading
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const submitSpinner = document.getElementById('submitSpinner');
            
            submitBtn.disabled = true;
            submitText.style.display = 'none';
            submitSpinner.style.display = 'inline-block';
            
            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/update-password.html'
                });
                
                if (error) throw error;
                
                showAlert('Link reset password telah dikirim ke email Anda. Silakan cek inbox (atau folder spam).', 'success');
                
                // Clear form
                document.getElementById('email').value = '';
                
            } catch (error) {
                console.error('Reset password error:', error);
                showAlert('Gagal mengirim link reset. Pastikan email Anda terdaftar.', 'danger');
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                submitSpinner.style.display = 'none';
            }
        });
        
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);
        }
    </script>
</body>
</html>
