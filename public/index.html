<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistem Absensi QR Code PKKMB 2026">
    <title>Absensi PKKMB 2026</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header style="text-align: center; padding: 3rem 0;">
            <h1>Sistem Absensi PKKMB 2026</h1>
            <p style="font-size: 1.125rem; color: var(--gray-600); margin-top: 0.5rem;">
                Pengenalan Kehidupan Kampus Mahasiswa Baru
            </p>
        </header>

        <!-- Main Content -->
        <main style="max-width: 600px; margin: 0 auto;">
            <div class="card">
                <div class="card-body" style="text-align: center; padding: 2rem;">
                    <h2 style="margin-bottom: 1.5rem;">Selamat Datang</h2>
                    <p style="color: var(--gray-600); margin-bottom: 2rem;">
                        Silakan pilih menu di bawah ini untuk melanjutkan
                    </p>
                    
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <a href="login.html" class="btn btn-primary btn-lg">
                            Masuk
                        </a>
                        <a href="register.html" class="btn btn-outline btn-lg">
                            Daftar Akun Baru
                        </a>
                    </div>
                </div>
            </div>

            <!-- Info Section -->
            <div style="margin-top: 2rem; text-align: center; color: var(--gray-500); font-size: 0.875rem;">
                <p>Sistem Absensi Berbasis QR Code</p>
                <p>Universitas Pasir Pengaraian</p>
            </div>
        </main>
    </div>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Config -->
    <script src="js/config.js"></script>
    
    <!-- Check if already logged in -->
    <script>
        (async function() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                console.log('User already logged in, redirecting...');
                
                // Get user role
                const { data: roleData } = await supabase
                    .from('user_roles')
                    .select('role')
                    .eq('user_id', session.user.id)
                    .single();
                
                if (roleData) {
                    if (roleData.role === 'ADMIN') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'mahasiswa-dashboard.html';
                    }
                }
            }
        })();
    </script>
</body>
</html>
