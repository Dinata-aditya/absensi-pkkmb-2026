<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistem Absensi QR Code PKKMB 2026">
    <title>Absensi PKKMB 2026</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #10b981;
        }

        .landing-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            padding: 2rem 2.5rem 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        .card-header img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .card-header-title {
            flex: 1;
            padding: 0 .75rem;
        }

        .landing-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.375rem;
        }

        .landing-subtitle {
            font-size: 0.9375rem;
            color: var(--gray-500);
            margin-bottom: 0.25rem;
        }

        .landing-univ {
            font-size: 0.875rem;
            color: var(--primary-color);
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--gray-200);
            margin-bottom: 2rem;
        }

        .btn-block {
            display: block;
            width: 100%;
            margin-bottom: 0.875rem;
        }

        .footer-text {
            margin-top: 2rem;
            font-size: 0.8125rem;
            color: var(--gray-400);
        }
    </style>
</head>
<body>
    <div class="landing-card">
        <!-- Header: logo kiri | judul tengah | logo kanan -->
        <div class="card-header">
            <img src="img/logouniv.png" alt="Logo Universitas" onerror="this.style.display='none'">
            <div class="card-header-title">
                <h1 class="landing-title">Sistem Absensi PKKMB 2026</h1>
                <p class="landing-subtitle">Pengenalan Kehidupan Kampus Mahasiswa Baru</p>
                <p class="landing-univ">Universitas Pasir Pengaraian</p>
            </div>
            <img src="img/logopkkmb.png" alt="Logo PKKMB" onerror="this.style.display='none'">
        </div>

        <hr class="divider">

        <!-- Buttons -->
        <a href="login.html" class="btn btn-primary btn-lg btn-block">Masuk</a>
        <a href="register.html" class="btn btn-outline btn-lg btn-block">Daftar Akun Baru</a>

        <p class="footer-text">© 2026 PKKMB UPP</p>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script>
        (async function () {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const { data: roleData } = await supabase
                    .from('user_roles')
                    .select('role')
                    .eq('user_id', session.user.id)
                    .single();
                if (roleData) {
                    window.location.href = roleData.role === 'ADMIN'
                        ? 'admin-dashboard.html'
                        : 'mahasiswa-dashboard.html';
                }
            }
        })();
    </script>
</body>
</html>
