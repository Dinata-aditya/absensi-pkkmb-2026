<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Update Password PKKMB 2026">
    <title>Update Password - PKKMB 2026</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .update-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
        }
        
        .update-card {
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>
<body>
    <div class="update-container">
        <div class="update-card card">
            <div class="card-header">
                <h2 class="card-title text-center">Buat Password Baru</h2>
                <p class="text-center" style="color: var(--gray-600); margin: 0;">
                    Masukkan password baru Anda
                </p>
            </div>
            
            <div class="card-body">
                <!-- Alert Container -->
                <div id="alertContainer"></div>
                
                <!-- Update Password Form -->
                <form id="updateForm">
                    <!-- New Password -->
                    <div class="form-group">
                        <label for="password" class="form-label required">Password Baru</label>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Min. 8 karakter"
                            required
                            autocomplete="new-password"
                            autofocus
                        >
                        <span class="form-error" id="passwordError"></span>
                    </div>
                    
                    <!-- Confirm Password -->
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label required">Konfirmasi Password Baru</label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            class="form-input" 
                            placeholder="Ulangi password baru"
                            required
                            autocomplete="new-password"
                        >
                        <span class="form-error" id="confirmPasswordError"></span>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitBtn">
                        <span id="submitText">Update Password</span>
                        <span id="submitSpinner" class="spinner" style="display: none;"></span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Config -->
    <script src="js/config.js"></script>
    
    <!-- Update Password Logic -->
    <script>
        document.getElementById('updateForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Clear errors
            document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
            document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation
            if (!password) {
                showFieldError('password', 'Password wajib diisi');
                return;
            }
            
            if (password.length < 8) {
                showFieldError('password', 'Password minimal 8 karakter');
                return;
            }
            
            if (!confirmPassword) {
                showFieldError('confirmPassword', 'Konfirmasi password wajib diisi');
                return;
            }
            
            if (password !== confirmPassword) {
                showFieldError('confirmPassword', 'Password tidak cocok');
                return;
            }
            
            // Show loading
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const submitSpinner = document.getElementById('submitSpinner');
            
            submitBtn.disabled = true;
            submitText.style.display = 'none';
            submitSpinner.style.display = 'inline-block';
            
            try {
                const { error } = await supabase.auth.updateUser({
                    password: password
                });
                
                if (error) throw error;
                
                showAlert('Password berhasil diupdate! Mengarahkan ke login...', 'success');
                
                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                console.error('Update password error:', error);
                showAlert('Gagal update password. ' + error.message, 'danger');
                
                // Re-enable button
                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                submitSpinner.style.display = 'none';
            }
        });
        
        function showFieldError(fieldName, message) {
            const field = document.getElementById(fieldName);
            const errorSpan = document.getElementById(fieldName + 'Error');
            
            if (field) field.classList.add('error');
            if (errorSpan) errorSpan.textContent = message;
        }
        
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);
        }
    </script>
</body>
</html>
